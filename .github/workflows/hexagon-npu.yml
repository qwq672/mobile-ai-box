name: Build AIBox NPU APK (Hexagon)

# 手动触发的 ggml-hexagon 构建。
#
# 为什么不用 GitHub 托管 runner：
#   Hexagon SDK 需要 Qualcomm 账号授权下载，不能放进公共 CI；
#   skel 编译依赖 hexagon-clang / QAIC / IDL 工具链，只能在装好 SDK 的机器上跑。
#
# runner 需要预先准备：
#   1. Hexagon SDK 6.7.0.0（上游 llama.cpp 文档/toolchain v0.8 用的就是这一版；
#      环境变量 HEXAGON_SDK_ROOT，可选 HEXAGON_TOOLS_ROOT）
#      SDK 内需含 hvx/v73、v75、v79、v81、v85 对应的 toolv21 预编译库
#      上游 docs 用 ghcr.io/snapdragon-toolchain/arm64-android:v0.8 容器，
#      里面是 Hexagon SDK 6.7.0.0（该容器只用于编 llama.cpp，本项目仍用下面的 NDK）
#   2. Android SDK + NDK 26.1.10909125 + cmake 3.31.6
#      （ggml-hexagon 的 htp 子工程要求 CMake >= 3.22.2，AGP 默认的 3.22.1 不够）
#   3. Vulkan 头（NDK sysroot 下 vulkan/vulkan.hpp），用于 ggml-vulkan 回退
#
# 说明：上游的 HEXAGON_HTP_CERT 只作用于 Windows 构建；Android 这里产出的 skel
# 是未签名的，能否在零售机上加载取决于设备的 FastRPC unsigned PD 策略。
#
# 产物：app/build/outputs/apk/release/app-release.apk，内含 assets/hexagon/libggml-htp-v{73,75,79,81,85}.so
on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp tag/commit（需包含 ggml-hexagon）'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

concurrency:
  group: hexagon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Hexagon NPU APK
    runs-on: [self-hosted, linux, x64, hexagon]
    timeout-minutes: 360
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.31.6
      LLAMA_REF: ${{ inputs.llama_ref }}
      HTP_ARCHS: v73 v75 v79 v81 v85

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          : "${HEXAGON_SDK_ROOT:?runner 未设置 HEXAGON_SDK_ROOT}"
          test -d "$HEXAGON_SDK_ROOT" || { echo "::error::HEXAGON_SDK_ROOT 不存在"; exit 1; }
          echo "HEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT"
          cat "$HEXAGON_SDK_ROOT/hexagon_sdk.json" 2>/dev/null | head -20 || true
          echo "::notice::Android 构建产出的 HTP skel 未签名，能否加载取决于设备 FastRPC unsigned PD 策略"
          : "${ANDROID_HOME:?runner 未设置 ANDROID_HOME}"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || {
            echo "::error::缺少 NDK $NDK_VERSION"; exit 1; }
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" || {
            echo "::error::缺少 cmake $CMAKE_VERSION"; exit 1; }
          VK_HPP="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.hpp"
          test -f "$VK_HPP" || {
            echo "::error::缺少 $VK_HPP（ggml-vulkan 必需）"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # ggml-vulkan 需要 glslc，NDK 自带一份
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          # 官方 zip 里的 qaic 是未解包的，hexagon_fun.cmake 期望 ipc/fastrpc/qaic/bin/qaic
          make -C "$HEXAGON_SDK_ROOT/ipc/fastrpc/qaic" >/dev/null
          test -x "$HEXAGON_SDK_ROOT/ipc/fastrpc/qaic/bin/qaic" || {
            echo "::error::qaic 准备失败"; exit 1; }
          for v in $HTP_ARCHS; do
            test -d "$HEXAGON_SDK_ROOT/rtos/qurt/compute$v" || {
              echo "::error::SDK 缺少 compute$v（$v 需要 Hexagon SDK 6.7.0.0）"; exit 1; }
            test -d "$HEXAGON_SDK_ROOT/tools/HEXAGON_Tools/21.0.04/Tools/target/hexagon/lib/$v" || {
              echo "::warning::未找到 $v 的工具链库，编译可能失败"; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_REF }})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-hexagon-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1

      # 第一遍：编译 host 端 libggml-hexagon / libllama 等。
      # 注意：AGP 只会构建主工程目标，ExternalProject 的 htp-vXX 不会自动编译，
      # 所以下面单独调用 CMake 构建五个 skel。
      - name: Build native (host)
        run: ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Build HTP skels
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          test -f "$BD/CMakeCache.txt" || { echo "::error::找不到 CMake 构建目录"; exit 1; }
          echo "CMake build dir: $BD"
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" --build "$BD" --target \
            htp-v73 htp-v75 htp-v79 htp-v81 htp-v85
          ls -lh "$BD/llama_build/ggml/src/ggml-hexagon/"libggml-htp-*.so

      - name: Collect HTP skels into assets
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          SRC="$BD/llama_build/ggml/src/ggml-hexagon"
          mkdir -p app/src/main/assets/hexagon
          for v in $HTP_ARCHS; do
            src="$SRC/libggml-htp-$v.so"
            if [ ! -f "$src" ]; then
              echo "::error::没有生成 libggml-htp-$v.so（检查 Hexagon SDK 是否支持 $v）"
              exit 1
            fi
            cp -f "$src" app/src/main/assets/hexagon/
          done
          ls -lh app/src/main/assets/hexagon/

      # 第二遍：assets 变了，mergeAssets 会重新打包；native 部分直接命中缓存。
      - name: Repackage APK with skels
        run: ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::没有找到 APK"; exit 1; }
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'assets/hexagon/libggml-htp-v' || {
            echo "::error::APK 里没有 HTP skel"; exit 1; }
          unzip -l "$apk" | grep -E 'libggml-hexagon|libggml-vulkan|libaibox' || true
          out="aibox-hexagon-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aibox-hexagon-apk
          path: |
            aibox-hexagon-*.apk
            aibox-hexagon-*.apk.sha256
          retention-days: 14
