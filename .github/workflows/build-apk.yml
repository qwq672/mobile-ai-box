name: Build AIBox APK

# 重要修复(2026-11-07): 用 pocket-llm 风格的极简 CI (只 assembleRelease,无后处理)
# 实验 A 已证明: aibox 源码 + pocket-llm 配置能装上 Android 16 / Magic OS 8
# 实验 B 已证明: aibox 配置 + pocket-llm 源码能装上 Android 16 / Magic OS 8
# 结论: main 上之前某个配置有问题, 把 exp-a 的配置 merge 到 main
on:
  push:
    branches: [ main, npu-build, npu-hosted ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_npu:
        description: '构建 Hexagon NPU 版（自托管 runner）'
        type: boolean
        default: false
      build_npu_hosted:
        description: '构建 Hexagon NPU 版（GitHub 托管 runner + Snapdragon 工具链容器）'
        type: boolean
        default: false

permissions:
  contents: read

# 注意：NPU job 需要一台已配置 Hexagon SDK 6.7.0.0 的自托管 runner：
#   runs-on 标签：self-hosted, linux, x64, hexagon
#   环境变量：HEXAGON_SDK_ROOT（可选 HEXAGON_TOOLS_ROOT）、ANDROID_HOME
#   依赖：NDK 26.1.10909125、cmake 3.31.6、vulkan/vulkan.hpp、qaic 已 make
# 普通 push 不会触发 NPU job；只有 workflow_dispatch 勾选 build_npu，
# 或 push 到 npu-build 分支时才会进入 NPU 队列。

jobs:
  build:
    name: Assemble arm64-v8a Release APK
    # 只在 main 的 push / 手动触发时跑；npu-build 分支只跑 NPU job
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.22.1
      LLAMA_REF: v1.0.0
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + Vulkan SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; fi
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 装 glslc + Vulkan SDK headers 用于 Vulkan 后端编译
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends glslang-tools libvulkan-dev 2>/dev/null || \
            echo "::warning::glslc/libvulkan-dev not installed, Vulkan backend will fail"
          which glslc || which glslangValidator || true
          ls /usr/include/vulkan/vulkan.hpp || true

      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_REF }})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Fetch SPIRV-Headers (for Vulkan backend)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
          cd /tmp/spirv-headers
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          sudo make install

      - name: Fetch Vulkan-Hpp (C++ bindings, not in NDK)
        run: |
          set +e
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp /tmp/vulkan-hpp
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers-2
          NDK_SYSROOT=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          NDK_VULKAN=$NDK_SYSROOT/vulkan
          NDK_VK_VIDEO=$NDK_SYSROOT/vk_video
          NDK_SPIRV=$NDK_SYSROOT/spirv
          sudo cp $NDK_VULKAN/vulkan_android.h /tmp/vulkan_android.h.bak 2>/dev/null || true
          sudo rm -rf $NDK_VULKAN
          sudo mkdir -p $NDK_VULKAN
          sudo cp -r /tmp/vulkan-headers/include/vulkan/* $NDK_VULKAN/
          sudo cp -r /tmp/vulkan-hpp/vulkan/* $NDK_VULKAN/
          sudo rm -rf $NDK_VK_VIDEO
          sudo mkdir -p $NDK_VK_VIDEO
          sudo cp -r /tmp/vulkan-headers/include/vk_video/* $NDK_VK_VIDEO/ 2>/dev/null || true
          sudo rm -rf $NDK_SPIRV
          sudo mkdir -p $NDK_SPIRV
          sudo cp -r /tmp/spirv-headers-2/include/spirv/* $NDK_SPIRV/
          if [ ! -f $NDK_VULKAN/vulkan_android.h ] && [ -f /tmp/vulkan_android.h.bak ]; then
            sudo cp /tmp/vulkan_android.h.bak $NDK_VULKAN/vulkan_android.h
          fi
          ls $NDK_VULKAN/vulkan.hpp
          ls $NDK_VULKAN/vulkan_core.h
          ls $NDK_SPIRV/unified1/spirv.hpp
          HPP_VER=$(grep -E 'static_assert.*VK_HEADER_VERSION' $NDK_VULKAN/vulkan.hpp | head -1 | grep -oE '[0-9]+' | head -1)
          echo "vulkan.hpp expects VK_HEADER_VERSION = $HPP_VER"
          if [ -n "$HPP_VER" ]; then
            sudo sed -i "s/#define VK_HEADER_VERSION [0-9]*/#define VK_HEADER_VERSION $HPP_VER/" $NDK_VULKAN/vulkan_core.h
            echo "vulkan_core.h VK_HEADER_VERSION patched to $HPP_VER"
          fi
          # 兜底:如果 sed 没生效,直接注释掉 vulkan.hpp 中的 VULKAN_HPP_STATIC_ASSERT VK_HEADER_VERSION 行
          # 这避免 vulkan.hpp 期望的版本与 vulkan_core.h 不一致导致编译失败 (aibox 风格)
          sudo sed -i '/VULKAN_HPP_STATIC_ASSERT.*VK_HEADER_VERSION/s/^/\/\/ DISABLED: /' $NDK_VULKAN/vulkan.hpp
          grep -E 'define VK_HEADER_VERSION ' $NDK_VULKAN/vulkan_core.h || true
          sed -n '40,50p' $NDK_VULKAN/vulkan.hpp || true

      - name: Cache Gradle wrapper and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1

      # ============================================================
      # 实验 A: 完全模仿 pocket-llm 的极简 build 步骤
      # 只跑 ./gradlew :app:assembleRelease (pocket-llm 风格)
      # 不构建 Debug (pocket-llm 也不构建 Debug)
      # 无 zipalign / apksigner sign 后处理 (pocket-llm 也没)
      # ============================================================
      - name: Build release APK (pocket-llm 风格,极简)
        run: |
          chmod +x ./gradlew
          # pocket-llm 的 build-apk.sh 风格: 直接 assembleRelease, 无任何后处理
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APK
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/aibox-arm64-v8a-release.apk
          # 也保留 Debug APK 用于对比(如果构建了的话)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" out/aibox-arm64-v8a-debug.apk
          fi
          ls -la out

      - name: Diagnostic dump (只读)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -la "$APK"
          sha256sum "$APK"
          echo "=== unzip -l ==="
          unzip -l "$APK" | head -30
          echo "=== apksigner verify ==="
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | head -15
          fi
          echo "=== META-INF 签名文件 ==="
          unzip -l "$APK" | grep -E "META-INF/.*\.(SF|RSA|DSA|MF)" || echo "(无 v1 文件)"
          echo "=== zipalign ==="
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign -type f 2>/dev/null | head -1)
          if [ -n "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v -P 16 4 "$APK" 2>&1 | head -5 || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibox-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Hexagon NPU 版（手动触发；需要自托管 runner）
  # 合并自原 hexagon-npu.yml：普通 push 不会跑到这里，
  # 只有 workflow_dispatch 勾选 build_npu 且 runner 在线时才执行。
  # ============================================================
  build-npu:
    name: Hexagon NPU APK
    # 两种入口：
    #   1. Actions → Run workflow → 勾选 build_npu
    #   2. push 到 npu-build 分支（方便脚本触发，不需要 actions:write 权限）
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_npu == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/npu-build') }}
    runs-on: [self-hosted, linux, x64, hexagon]
    timeout-minutes: 360
    concurrency:
      group: npu-${{ github.ref }}
      cancel-in-progress: false
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.31.6
      LLAMA_REF: v1.0.0
      HTP_ARCHS: v73 v75 v79 v81 v85
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          : "${HEXAGON_SDK_ROOT:?runner 未设置 HEXAGON_SDK_ROOT}"
          test -d "$HEXAGON_SDK_ROOT" || { echo "::error::HEXAGON_SDK_ROOT 不存在"; exit 1; }
          echo "HEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT"
          cat "$HEXAGON_SDK_ROOT/hexagon_sdk.json" 2>/dev/null | head -20 || true
          echo "::notice::Android 构建产出的 HTP skel 未签名，能否加载取决于设备 FastRPC unsigned PD 策略"
          : "${ANDROID_HOME:?runner 未设置 ANDROID_HOME}"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || {
            echo "::error::缺少 NDK $NDK_VERSION"; exit 1; }
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" || {
            echo "::error::缺少 cmake $CMAKE_VERSION"; exit 1; }
          VK_HPP="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.hpp"
          test -f "$VK_HPP" || {
            echo "::error::缺少 $VK_HPP（ggml-vulkan 必需）"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          make -C "$HEXAGON_SDK_ROOT/ipc/fastrpc/qaic" >/dev/null
          test -x "$HEXAGON_SDK_ROOT/ipc/fastrpc/qaic/bin/qaic" || {
            echo "::error::qaic 准备失败"; exit 1; }
          for v in $HTP_ARCHS; do
            test -d "$HEXAGON_SDK_ROOT/rtos/qurt/compute$v" || {
              echo "::error::SDK 缺少 compute$v（$v 需要 Hexagon SDK 6.7.0.0）"; exit 1; }
            test -d "$HEXAGON_SDK_ROOT/tools/HEXAGON_Tools/21.0.04/Tools/target/hexagon/lib/$v" || {
              echo "::warning::未找到 $v 的工具链库，编译可能失败"; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_REF }})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-hexagon-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1

      # 第一遍：编译 host 端 libggml-hexagon / libllama 等。
      # AGP 只构建主工程目标，ExternalProject 的 htp-vXX 不会自动编译，下面单独编译 skel。
      - name: Build native (host)
        run: ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Build HTP skels
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          test -f "$BD/CMakeCache.txt" || { echo "::error::找不到 CMake 构建目录"; exit 1; }
          echo "CMake build dir: $BD"
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" --build "$BD" --target \
            htp-v73 htp-v75 htp-v79 htp-v81 htp-v85
          ls -lh "$BD/llama_build/ggml/src/ggml-hexagon/"libggml-htp-*.so

      - name: Collect HTP skels into assets
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          SRC="$BD/llama_build/ggml/src/ggml-hexagon"
          mkdir -p app/src/main/assets/hexagon
          for v in $HTP_ARCHS; do
            src="$SRC/libggml-htp-$v.so"
            if [ ! -f "$src" ]; then
              echo "::error::没有生成 libggml-htp-$v.so（检查 Hexagon SDK 是否支持 $v）"
              exit 1
            fi
            cp -f "$src" app/src/main/assets/hexagon/
          done
          ls -lh app/src/main/assets/hexagon/

      # 第二遍：assets 变了，mergeAssets 会重新打包；native 部分命中缓存。
      - name: Repackage APK with skels
        run: ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::没有找到 APK"; exit 1; }
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'assets/hexagon/libggml-htp-v' || {
            echo "::error::APK 里没有 HTP skel"; exit 1; }
          unzip -l "$apk" | grep -E 'libggml-hexagon|libggml-vulkan|libaibox' || true
          out="aibox-hexagon-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aibox-hexagon-apk
          path: |
            aibox-hexagon-*.apk
            aibox-hexagon-*.apk.sha256
          retention-days: 14

  # ============================================================
  # Hexagon NPU 版（GitHub 托管 runner + 公开 Snapdragon 工具链容器）
  # 不需要自托管 runner；容器里自带 Hexagon SDK 6.7 / HTP 工具链 / qaic。
  # 触发：workflow_dispatch 勾选 build_npu_hosted，或 push 到 npu-hosted 分支。
  # ============================================================
  build-npu-hosted:
    name: Hexagon NPU APK (hosted container)
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_npu_hosted == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/npu-hosted') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.8
      options: --user root
    timeout-minutes: 360
    concurrency:
      group: npu-hosted-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.31.6
      LLAMA_REF: v1.0.0
      HTP_ARCHS: v73 v75 v79 v81 v85
      CMAKE_PREFIX_PATH: /usr/local
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install JDK / build tools
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            openjdk-21-jdk-headless unzip wget git make build-essential ca-certificates
          JDK_DIR=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          java -version

      - name: Install Android SDK / NDK / CMake
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q -O /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION/shader-tools/linux-x86_64/glslc"

      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_REF }})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Install Vulkan headers into NDK sysroot
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          test -d "$NDK_SYSROOT" || { echo "::error::NDK sysroot 不存在: $NDK_SYSROOT"; exit 1; }
          rm -rf /tmp/vk /tmp/vkhpp /tmp/spirv
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vk
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp /tmp/vkhpp
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv
          rm -rf "$NDK_SYSROOT/vulkan" "$NDK_SYSROOT/vk_video" "$NDK_SYSROOT/spirv"
          mkdir -p "$NDK_SYSROOT/vulkan" "$NDK_SYSROOT/vk_video" "$NDK_SYSROOT/spirv"
          cp -r /tmp/vk/include/vulkan/* "$NDK_SYSROOT/vulkan/"
          cp -r /tmp/vkhpp/vulkan/* "$NDK_SYSROOT/vulkan/"
          cp -r /tmp/vk/include/vk_video/* "$NDK_SYSROOT/vk_video/" 2>/dev/null || true
          cp -r /tmp/spirv/include/spirv/* "$NDK_SYSROOT/spirv/"
          HPP_VER=$(grep -E 'static_assert.*VK_HEADER_VERSION' "$NDK_SYSROOT/vulkan/vulkan.hpp" | head -1 | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$HPP_VER" ]; then
            sed -i "s/#define VK_HEADER_VERSION [0-9]*/#define VK_HEADER_VERSION $HPP_VER/" "$NDK_SYSROOT/vulkan/vulkan_core.h"
          fi
          sed -i '/VULKAN_HPP_STATIC_ASSERT.*VK_HEADER_VERSION/s/^/\/\/ DISABLED: /' "$NDK_SYSROOT/vulkan/vulkan.hpp"
          ls "$NDK_SYSROOT/vulkan/vulkan.hpp"

      # ggml-vulkan 的 CMakeLists 用 find_package(SPIRV-Headers CONFIG REQUIRED)，
      # 只拷头文件不够，需要安装它的 CMake config（标准 job 也是装到 /usr/local）。
      - name: Install SPIRV-Headers CMake package
        run: |
          set -euo pipefail
          cmake -S /tmp/spirv -B /tmp/spirv-build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSPIRV_HEADERS_SKIP_EXAMPLES=ON
          cmake --build /tmp/spirv-build --target install
          ls /usr/local/share/cmake/SPIRV-Headers/

      - name: Cache Gradle
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-npu-hosted-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1

      - name: Build native (host)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Build HTP skels
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          test -f "$BD/CMakeCache.txt" || { echo "::error::找不到 CMake 构建目录"; exit 1; }
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" --build "$BD" --target \
            htp-v73 htp-v75 htp-v79 htp-v81 htp-v85
          ls -lh "$BD/llama_build/ggml/src/ggml-hexagon/"libggml-htp-*.so

      - name: Collect HTP skels into assets
        run: |
          set -euo pipefail
          BD=$(dirname "$(find app/.cxx/Release -maxdepth 3 -name CMakeCache.txt | head -1)")
          SRC="$BD/llama_build/ggml/src/ggml-hexagon"
          mkdir -p app/src/main/assets/hexagon
          for v in $HTP_ARCHS; do
            cp -f "$SRC/libggml-htp-$v.so" app/src/main/assets/hexagon/
          done
          ls -lh app/src/main/assets/hexagon/

      - name: Repackage APK with skels
        run: ./gradlew :app:assembleRelease -Paibox.npu=true --no-daemon --stacktrace

      - name: Verify + collect APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::没有找到 APK"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/hexagon/libggml-htp-v' || {
            echo "::error::APK 里没有 HTP skel"; exit 1; }
          out="aibox-hexagon-hosted-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          cp "$apk" "out/$out"
          sha256sum "out/$out" | tee "out/$out.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aibox-hexagon-hosted-apk
          path: out/aibox-hexagon-hosted-*
          retention-days: 14

