name: Build AIBox APK (Exp A - Pocket-LLM Config)

# 实验 A: 用 pocket-llm 风格的极简 CI (只 assembleRelease,无后处理)
# 触发条件: 任意分支 push + workflow_dispatch (这样 exp-a-pocket-config 分支也能触发)
on:
  push:
    branches: [ main, exp-a-pocket-config ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: 26.1.10909125
      CMAKE_VERSION: 3.22.1
      LLAMA_REF: v0.4.1
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + Vulkan SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; fi
          export PATH="$(dirname "$SDKM"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 装 glslc + Vulkan SDK headers 用于 Vulkan 后端编译
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends glslang-tools libvulkan-dev 2>/dev/null || \
            echo "::warning::glslc/libvulkan-dev not installed, Vulkan backend will fail"
          which glslc || which glslangValidator || true
          ls /usr/include/vulkan/vulkan.hpp || true

      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_REF }})
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 --branch "${LLAMA_REF}" \
            https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Fetch SPIRV-Headers (for Vulkan backend)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
          cd /tmp/spirv-headers
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          sudo make install

      - name: Fetch Vulkan-Hpp (C++ bindings, not in NDK)
        run: |
          set +e
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp /tmp/vulkan-hpp
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers-2
          NDK_SYSROOT=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          NDK_VULKAN=$NDK_SYSROOT/vulkan
          NDK_VK_VIDEO=$NDK_SYSROOT/vk_video
          NDK_SPIRV=$NDK_SYSROOT/spirv
          sudo cp $NDK_VULKAN/vulkan_android.h /tmp/vulkan_android.h.bak 2>/dev/null || true
          sudo rm -rf $NDK_VULKAN
          sudo mkdir -p $NDK_VULKAN
          sudo cp -r /tmp/vulkan-headers/include/vulkan/* $NDK_VULKAN/
          sudo cp -r /tmp/vulkan-hpp/vulkan/* $NDK_VULKAN/
          sudo rm -rf $NDK_VK_VIDEO
          sudo mkdir -p $NDK_VK_VIDEO
          sudo cp -r /tmp/vulkan-headers/include/vk_video/* $NDK_VK_VIDEO/ 2>/dev/null || true
          sudo rm -rf $NDK_SPIRV
          sudo mkdir -p $NDK_SPIRV
          sudo cp -r /tmp/spirv-headers-2/include/spirv/* $NDK_SPIRV/
          if [ ! -f $NDK_VULKAN/vulkan_android.h ] && [ -f /tmp/vulkan_android.h.bak ]; then
            sudo cp /tmp/vulkan_android.h.bak $NDK_VULKAN/vulkan_android.h
          fi
          ls $NDK_VULKAN/vulkan.hpp
          ls $NDK_VULKAN/vulkan_core.h
          ls $NDK_SPIRV/unified1/spirv.hpp
          HPP_VER=$(grep -E 'static_assert.*VK_HEADER_VERSION' $NDK_VULKAN/vulkan.hpp | head -1 | grep -oE '[0-9]+' | head -1)
          echo "vulkan.hpp expects VK_HEADER_VERSION = $HPP_VER"
          if [ -n "$HPP_VER" ]; then
            sudo sed -i "s/#define VK_HEADER_VERSION [0-9]*/#define VK_HEADER_VERSION $HPP_VER/" $NDK_VULKAN/vulkan_core.h
            echo "vulkan_core.h VK_HEADER_VERSION patched to $HPP_VER"
          fi
          # 兜底:如果 sed 没生效,直接注释掉 vulkan.hpp 中的 VULKAN_HPP_STATIC_ASSERT VK_HEADER_VERSION 行
          # 这避免 vulkan.hpp 期望的版本与 vulkan_core.h 不一致导致编译失败 (aibox 风格)
          sudo sed -i '/VULKAN_HPP_STATIC_ASSERT.*VK_HEADER_VERSION/s/^/\/\/ DISABLED: /' $NDK_VULKAN/vulkan.hpp
          grep -E 'define VK_HEADER_VERSION ' $NDK_VULKAN/vulkan_core.h || true
          sed -n '40,50p' $NDK_VULKAN/vulkan.hpp || true

      - name: Cache Gradle wrapper and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-v1

      # ============================================================
      # 实验 A: 完全模仿 pocket-llm 的极简 build 步骤
      # 只跑 ./gradlew :app:assembleRelease (pocket-llm 风格)
      # 不构建 Debug (pocket-llm 也不构建 Debug)
      # 无 zipalign / apksigner sign 后处理 (pocket-llm 也没)
      # ============================================================
      - name: Build release APK (pocket-llm 风格,极简)
        run: |
          chmod +x ./gradlew
          # pocket-llm 的 build-apk.sh 风格: 直接 assembleRelease, 无任何后处理
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APK
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/aibox-arm64-v8a-release-exp-a.apk
          # 也保留 Debug APK 用于对比(如果构建了的话)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" out/aibox-arm64-v8a-debug-exp-a.apk
          fi
          ls -la out

      - name: Diagnostic dump (只读)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -la "$APK"
          sha256sum "$APK"
          echo "=== unzip -l ==="
          unzip -l "$APK" | head -30
          echo "=== apksigner verify ==="
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | head -15
          fi
          echo "=== META-INF 签名文件 ==="
          unzip -l "$APK" | grep -E "META-INF/.*\.(SF|RSA|DSA|MF)" || echo "(无 v1 文件)"
          echo "=== zipalign ==="
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign -type f 2>/dev/null | head -1)
          if [ -n "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v -P 16 4 "$APK" 2>&1 | head -5 || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibox-apk-exp-a
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
